# Renderiza el sitio con Quarto y lo publica en GitHub Pages al fusionar en main (o a mano).
# Requisito único: en Settings → Pages → Build and deployment → Source, elegir «GitHub Actions».
name: Publicar web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Comprobar fuentes
        run: python scripts/comprobar_fuentes.py
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Renderizar
        run: quarto render
      - name: Configurar Pages (intenta activarlo si no lo está)
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
