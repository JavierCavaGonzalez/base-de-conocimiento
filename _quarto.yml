project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!_plantillas/"
    - "!_libro/"
  resources:
    - fonts/
    - marca/

lang: es
date-format: "D [de] MMMM [de] YYYY"

website:
  title: "IA y agentes en Business Central"
  description: "Libro vivo sobre inteligencia artificial y agentes en Microsoft Dynamics 365 Business Central: Copilot, los agentes que trae de serie y los que se construyen con el stack de Microsoft. Escrito por un consultor funcional mientras estudia y prueba en un sandbox."
  site-url: https://libro.javiercava.com/
  repo-url: https://github.com/JavierCavaGonzalez/base-de-conocimiento
  repo-actions: [issue]
  favicon: marca/favicon.png
  page-navigation: true
  search:
    location: navbar
    type: overlay
  # Primer nivel de la cabecera: la misma navegación que javiercava.com, para que el libro sea una sección más de la web.
  announcement:
    type: primary
    dismissable: false
    position: above-navbar
    content: >-
      <nav class="barra-global" aria-label="javiercava.com">
      <a class="barra-logo" href="https://javiercava.com/"><img src="/marca/logo-javier-cava.webp" alt="Javier Cava" width="300" height="112"></a>
      <ul class="barra-enlaces">
      <li><a href="https://javiercava.com/ia-en-business-central">Business Central</a></li>
      <li><a href="https://javiercava.com/ia-en-power-bi">Power BI</a></li>
      <li><a href="https://javiercava.com/blog">Blog</a></li>
      <li><a href="/" aria-current="page">Libro</a></li>
      <li><a href="https://javiercava.com/sobrejaviercava">Sobre mí</a></li>
      <li><a class="barra-contacto" href="https://javiercava.com/sobrejaviercava#hablamos">Contacto</a></li>
      </ul>
      </nav>
  navbar:
    collapse-below: xl
    left:
      - text: "Libro"
        href: libro/index.qmd
      - text: "Ejercicios"
        href: ejercicios/index.qmd
      - text: "Base de conocimiento"
        href: conocimiento/index.qmd
      - text: "Diario"
        href: diario/index.qmd
      - text: "Escaparate"
        href: escaparate/index.qmd
    right:
      - text: "Sobre el libro"
        href: sobre.qmd
      - text: "Suscripción"
        href: suscripcion.qmd
  sidebar:
    - id: libro
      title: "El libro"
      style: docked
      collapse-level: 2
      contents:
        - text: "Índice del libro"
          href: libro/index.qmd
        - section: "Parte I · Entender"
          contents:
            - libro/01-que-es-un-agente.qmd
            - libro/02-el-agente-que-menos-decide.qmd
            - libro/03-copilot-en-business-central.qmd
            - libro/04-los-agentes-que-ya-trae-business-central.qmd
        - section: "Parte II · Controlar"
          contents:
            - libro/05-permisos-identidad-y-auditoria.qmd
            - libro/06-observar-y-evaluar.qmd
        - section: "Parte III · Construir"
          contents:
            - libro/07-agent-designer.qmd
            - libro/08-copilot-studio-y-el-servidor-mcp.qmd
            - libro/09-orquestar-agent-framework-y-logic-apps.qmd
            - libro/10-microsoft-foundry.qmd
            - libro/11-agentes-y-copilot-en-al.qmd
            - libro/12-protocolos-y-seguridad.qmd
        - section: "Parte IV · Operar"
          contents:
            - libro/13-la-torre-de-control.qmd
            - libro/14-produccion-y-adopcion.qmd
    - id: conocimiento
      title: "Base de conocimiento"
      style: docked
      collapse-level: 1
      contents:
        - conocimiento/index.qmd
        - auto: conocimiento/fichas
        - auto: conocimiento/conceptos
        - auto: conocimiento/laboratorios
  page-footer:
    left: "© 2026 Javier Cava González · Texto CC BY-NC-SA 4.0 · Código MIT"
    center: "[javiercava.com](https://javiercava.com) · [Novedades del libro](/novedades.qmd) · [LinkedIn](https://www.linkedin.com/in/javier-cava-gonzalez/) · [YouTube](https://www.youtube.com/@JavierCavaInTech/videos) · [info@javiercava.com](mailto:info@javiercava.com)"
    right: "Obra independiente, no afiliada a Microsoft Corporation ni autorizada, patrocinada o aprobada por ella. Microsoft, Dynamics 365, Business Central y Copilot son marcas de Microsoft Corporation."

format:
  html:
    theme:
      light: [cosmo, tema.scss]
      dark: [cosmo, tema.scss, tema-oscuro.scss]
    css: fuentes.css
    include-in-header:
      text: |
        <link rel="apple-touch-icon" href="/marca/apple-touch-icon.png">
    toc: true
    toc-depth: 3
    toc-title: "En esta página"
    code-copy: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/(?:www\.|libro\.)?javiercava\.com'
    smooth-scroll: true

execute:
  enabled: false
