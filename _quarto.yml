project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!_plantillas/"
    - "!_libro/"

lang: es
date-format: "D [de] MMMM [de] YYYY"

website:
  title: "Las llaves del ERP"
  description: "Libro vivo sobre inteligencia artificial y agentes en Microsoft Dynamics 365 Business Central, escrito por un consultor funcional mientras estudia y prueba en un sandbox."
  site-url: https://javiercavagonzalez.github.io/base-de-conocimiento/
  repo-url: https://github.com/JavierCavaGonzalez/base-de-conocimiento
  repo-actions: [issue]
  page-navigation: true
  search: true
  navbar:
    left:
      - text: "Libro"
        href: libro/index.qmd
      - text: "Conocimiento"
        href: conocimiento/index.qmd
      - text: "Ejercicios"
        href: ejercicios/index.qmd
      - text: "Escaparate"
        href: escaparate/index.qmd
      - text: "Diario"
        href: diario/index.qmd
    right:
      - text: "Novedades"
        href: novedades.qmd
      - text: "Suscripción"
        href: suscripcion.qmd
      - text: "Sobre"
        href: sobre.qmd
  sidebar:
    - id: libro
      title: "Libro"
      style: docked
      collapse-level: 2
      contents:
        - libro/index.qmd
        - section: "Parte I · Entender"
          contents:
            - libro/01-que-es-un-agente.qmd
    - id: conocimiento
      title: "Conocimiento"
      style: docked
      collapse-level: 1
      contents:
        - conocimiento/index.qmd
        - auto: conocimiento/fichas
        - auto: conocimiento/conceptos
        - auto: conocimiento/laboratorios
  page-footer:
    left: "Texto: CC BY-NC-SA 4.0 · Código: MIT · © 2026 Javier Cava González"
    right: "Obra independiente, no afiliada a Microsoft Corporation ni autorizada, patrocinada o aprobada por ella. Microsoft, Dynamics 365, Business Central y Copilot son marcas de Microsoft Corporation."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "En esta página"
    code-copy: true
    link-external-newwindow: true

execute:
  enabled: false
